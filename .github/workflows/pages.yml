          DEST = ROOT / 'docs'
          ORIGIN = MANIFEST['origin']
          assert ORIGIN == 'https://ban-do-di-san-champa.arch-letricong.chatgpt.site/'
          
          def valid(data, item):
              return len(data) == item['size'] and hashlib.sha256(data).hexdigest() == item['sha256']
          
          def transfer(item):
              relative = Path(item['path'])
              if relative.is_absolute() or '..' in relative.parts:
                  raise ValueError('Unsafe manifest path')
              target = DEST / relative
              if target.is_file() and valid(target.read_bytes(), item):
                  return 'cached'
              url = ORIGIN + urllib.parse.quote(relative.as_posix(), safe='/')
              failure = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Heritage-Atlas-Backup/1.0'})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          data = response.read(item['size'] + 1)
                      if not valid(data, item):
                          raise ValueError(f'Snapshot mismatch: {relative}; source may have changed or returned an access page')
                      target.parent.mkdir(parents=True, exist_ok=True)
                      temporary = target.with_name(target.name + '.importing')
                      temporary.write_bytes(data)
                      temporary.replace(target)
                      return 'downloaded'
                  except Exception as error:
                      failure = error
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f'Could not import {relative}: {failure}')
          
          def main():
              DEST.mkdir(exist_ok=True)
              counts = {'cached': 0, 'downloaded': 0}
              with ThreadPoolExecutor(max_workers=6) as pool:
                  work = [pool.submit(transfer, item) for item in MANIFEST['files']]
                  for future in as_completed(work):
                      counts[future.result()] += 1
              for item in MANIFEST['files']:
                  assert valid((DEST / item['path']).read_bytes(), item), item['path']
              (DEST / '.nojekyll').write_text('')
              provenance = {
                  'role': 'independent_static_backup',
                  'source_site': ORIGIN,
                  'source_version': MANIFEST['version'],
                  'source_commit': MANIFEST['commit'],
                  'verified_public_files': len(MANIFEST['files']),
                  'content_modified': False,
                  'coordinates_modified': False,
              }
              (DEST / 'BACKUP_PROVENANCE.json').write_text(json.dumps(provenance, ensure_ascii=False, indent=2) + '\n')
              print(json.dumps({'verified': len(MANIFEST['files']), **counts}))
          
          if __name__ == '__main__':
              main()
          PY_ATLAS
      - name: Preserve the independent copy in this repository
        run: |
          git add docs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve verified heritage atlas v234 snapshot'
            git push origin HEAD:main
          fi
      - name: Package the static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified backup
        id: deployment
        uses: actions/deploy-pages@v4
